name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend + backend unit
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
