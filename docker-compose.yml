services:
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: asms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    image: ${BACKEND_IMAGE}
    container_name: asms_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "${BACKEND_PORT}"
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/uploads:/app/uploads
