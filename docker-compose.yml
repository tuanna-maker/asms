services:
  postgres:
    image: postgres:16-alpine
    container_name: asms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asms_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-asms}
    volumes:
      - asms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asms} -d ${POSTGRES_DB:-asms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: asms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: asms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${BACKEND_PORT}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-asms}:${POSTGRES_PASSWORD:-asms_local_dev}@postgres:5432/${POSTGRES_DB:-asms}?schema=public"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TRUST_PROXY: "true"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  asms_pgdata:
